[project]
name = "prov-skills"
version = "0.2.0"
description = "The prov-skills Claude Code plugin (skills prov, journal, plot) and the plot module"
requires-python = ">=3.11"
dependencies = ["prov"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[tool.uv.sources]
prov = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prov_skills"]
