[project]
name = "prov-skills"
version = "0.1.1"
description = "Agent skills for prov projects: plot (house style, figures) and journal"
requires-python = ">=3.11"
dependencies = ["prov"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.scripts]
prov-skills = "prov_skills.cli:main"

[tool.uv.sources]
prov = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prov_skills"]
