[project]
name = "prov-journal"
version = "0.2.2"
description = "The prov project journal: docs, lint, index and Quartz sites"
requires-python = ">=3.11"
dependencies = ["prov", "pyyaml>=6"]

[project.scripts]
prov-journal = "prov_journal.cli:main"

[tool.uv.sources]
prov = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prov_journal"]
