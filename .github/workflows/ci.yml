name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -e packages/prov -e packages/prov-journal -e "packages/prov-skills[plot]" pytest
      - name: Lint
        run: uvx ruff@0.8.4 check packages conftest.py
      - name: Test
        run: .venv/bin/python -m pytest -q

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge checks (ADR numbers, deviations; on PRs also branch-only files and versions)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/pr_gate.py --base "origin/${{ github.base_ref }}"
          else
            python3 scripts/pr_gate.py
          fi
