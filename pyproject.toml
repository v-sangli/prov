[project]
name = "prov"
version = "0.1.1"
description = "Provenance records, IDs and code snapshots for research runs"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pyyaml>=6", "duckdb>=1.1"]

[project.optional-dependencies]
test = ["pytest>=8"]
wandb = ["wandb>=0.18"]
plot = ["matplotlib>=3.8"]

[project.scripts]
prov = "prov.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prov"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# E741 (variable named `l`) is used as a line variable throughout; not worth the churn.
ignore = ["E741"]
